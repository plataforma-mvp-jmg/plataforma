# Workflow reutilizable de publicación de módulos (I4-1, ADR 0011).
# Lo llama cada módulo FIJADO POR SHA, solo en push a main (código ya revisado y con los controles en
# verde). Construye la imagen, la prueba, la publica en GHCR por digest y firma dos atestaciones:
# procedencia (SLSA) y SBOM (SPDX). Al final pide el despliegue a staging (I4-2a, ADR 0012): crea un
# deployment de GitHub con {imagen, digest}; el deployer lo ejecuta solo si la atestación es válida.
# El llamador debe otorgar deployments: write (plantilla-modulo >= 0.5.0).
name: modulo-publicar
on:
  workflow_call:
    outputs:
      imagen:
        description: Nombre de la imagen en GHCR (sin tag)
        value: ${{ jobs.publicar.outputs.imagen }}
      digest:
        description: Digest sha256 de la imagen publicada
        value: ${{ jobs.publicar.outputs.digest }}

permissions:
  contents: read

jobs:
  publicar:
    name: publicar (imagen, SBOM y atestaciones)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      deployments: write
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
      digest: ${{ steps.publicar.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1. Prueba de humo ANTES de publicar: una imagen que no arranca nunca llega al registro.
      - name: Construir para probar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: modulo:prueba
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Prueba de humo (health, meta y usuario no root)
        run: |
          set -euo pipefail
          esperado=$(sed -n 's/^id: *//p' modulo.yaml)
          uid=$(docker run --rm --entrypoint id modulo:prueba -u)
          if [ "$uid" = "0" ]; then echo "::error::la imagen corre como root"; exit 1; fi
          docker run -d --name humo -p 3000:3000 modulo:prueba
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/health
          meta=$(curl -fsS http://127.0.0.1:3000/meta)
          echo "meta: $meta"
          echo "$meta" | grep -q "\"id\":\"$esperado\"" || { echo "::error::/meta no devuelve el id $esperado"; docker logs humo; exit 1; }
          # Sin token, la API del módulo responde 401 (contrato E2).
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/m/$esperado/api/v1/yo")
          [ "$code" = "401" ] || { echo "::error::sin token se esperaba 401 y respondió $code"; exit 1; }
          docker rm -f humo >/dev/null

      # 2. Publicación por digest (el tag es solo una referencia legible).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        id: publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.nombre.outputs.imagen }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          provenance: false

      # 3. SBOM de la imagen publicada y atestaciones firmadas (Sigstore público: repo público).
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ steps.nombre.outputs.imagen }}@${{ steps.publicar.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.nombre.outputs.imagen }}
          subject-digest: ${{ steps.publicar.outputs.digest }}
          push-to-registry: true

      - name: Atestación de la SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.nombre.outputs.imagen }}
          subject-digest: ${{ steps.publicar.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # 4. Pedido de despliegue a staging. Lo crea GITHUB_TOKEN, así el creador es github-actions[bot]:
      #    el deployer rechaza pedidos creados por personas (ADR 0012).
      - name: Pedir despliegue a staging
        id: pedido
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
          DIGEST: ${{ steps.publicar.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$GITHUB_SHA" --arg imagen "$IMAGEN" --arg digest "$DIGEST" '{
            ref: $ref, environment: "staging", task: "deploy:plataforma", auto_merge: false, required_contexts: [],
            production_environment: false, description: "Publicado por modulo-publicar",
            payload: {imagen: $imagen, digest: $digest}
          }' > pedido.json
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --method POST --input pedido.json --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Pedido de despliegue a staging: #$id"

      - name: Resumen
        env:
          IMAGEN: ${{ steps.nombre.outputs.imagen }}
          DIGEST: ${{ steps.publicar.outputs.digest }}
          PEDIDO: ${{ steps.pedido.outputs.id }}
        run: |
          {
            echo "## Imagen publicada"
            echo ""
            echo "- Imagen: \`$IMAGEN@$DIGEST\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Atestaciones: procedencia y SBOM (SPDX)"
            echo "- Pedido de despliegue a staging: #$PEDIDO (lo ejecuta el deployer)"
            echo ""
            echo "Verificar: \`gh attestation verify oci://$IMAGEN@$DIGEST --owner $GITHUB_REPOSITORY_OWNER\`"
          } >> "$GITHUB_STEP_SUMMARY"
