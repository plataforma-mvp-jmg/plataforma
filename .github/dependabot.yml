version: 2
# Un PR por ecosistema y por semana (groups): cada PR suelto pedía su propia revisión de Sistemas
# y, al mergear uno, el resto quedaba con el lockfile en conflicto y la aprobación descartada.
# Las actualizaciones de seguridad siguen llegando en PRs propios, sin esperar al agrupado.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencias]
    groups:
      acciones:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    labels: [dependencias]
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ['*']
    ignore:
      # TypeScript 7 todavía no es compatible con typescript-eslint (peer <6.1; ADR 0001).
      # Revisar cuando typescript-eslint lo soporte: con el salto mayor adentro, el PR agrupado entero queda en rojo.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
